[build-system]
requires = ["scikit-build-core", "setuptools_scm"]
build-backend = "scikit_build_core.build"

[project]
name = "libsonata"
dynamic = ["version"]
description = "SONATA files reader"
readme = "README.rst"
license = "LGPL-3.0-or-later"
requires-python = ">=3.9"
authors = [{name = "Blue Brain Project, EPFL"}]
dependencies = ["numpy>=1.17.3"]

[project.optional-dependencies]
docs = ["sphinx-bluebrain-theme"]

[project.urls]
Homepage = "https://github.com/openbraininstitute/libsonata"

[tool.scikit-build]
cmake.args = [
    "-DEXTLIB_FROM_SUBMODULES=ON",
    "-DSONATA_PYTHON=ON",
    "-DSONATA_TESTS=OFF",
    "-DSONATA_CXX_WARNINGS=OFF",
]
cmake.build-type = "Release"
wheel.packages = ["python/libsonata"]
wheel.exclude = ["include/", "lib/", "share/"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
